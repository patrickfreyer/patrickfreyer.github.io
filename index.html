<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Patrick Freyer's Personal Website">
    <title>Patrick Freyer | Personal Website</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Add Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Add marked for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body x-data="mainData()">
    <header class="header">
        <nav class="nav-container">
            <div class="logo">PF</div>
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#updates">Updates</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#thoughts">Thoughts</a></li>
                <li><a href="#social">Connect</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="hero" class="hero-section">
            <div class="container">
                <h1>Patrick Freyer</h1>
                <p class="subtitle">Software Developer & Technology Enthusiast</p>
                <div class="social-links">
                    <a href="https://github.com/patrickfreyer" target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="https://linkedin.com/in/patrickfreyer" target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-linkedin"></i>
                    </a>
                </div>
            </div>
        </section>

        <!-- Include all components -->
        <div x-html="await includeComponent('about')"></div>
        <div x-html="await includeComponent('updates')"></div>
        <div x-html="await includeComponent('projects')"></div>
        <div x-html="await includeComponent('thoughts')"></div>
        <div x-html="await includeComponent('social')"></div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Patrick Freyer. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Main data management
        function mainData() {
            return {
                updates: [],
                projects: [],
                thoughts: [],
                socialProfiles: [],

                async init() {
                    // Load all data
                    await Promise.all([
                        this.loadData('updates'),
                        this.loadData('projects'),
                        this.loadData('thoughts'),
                        this.loadData('social')
                    ]);
                },

                async loadData(type) {
                    try {
                        const response = await fetch(`_data/${type}.yaml`);
                        const text = await response.text();
                        const data = this.parseYAML(text);
                        
                        // Handle the root key in YAML files
                        if (type === 'thoughts') {
                            this.thoughts = data.thoughts.map(thought => ({
                                ...thought,
                                // Parse markdown content
                                parsedContent: marked.parse(thought.content)
                            }));
                        } else {
                            this[type] = data[type] || data;
                        }
                    } catch (error) {
                        console.error(`Error loading ${type}:`, error);
                    }
                },

                async includeComponent(name) {
                    try {
                        const response = await fetch(`components/${name}.html`);
                        return await response.text();
                    } catch (error) {
                        console.error(`Error loading component ${name}:`, error);
                        return '';
                    }
                },

                formatDate(dateStr) {
                    return new Date(dateStr).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                },

                parseYAML(text) {
                    // Simple YAML parser for our basic needs
                    const lines = text.split('\n');
                    const result = {};
                    let current = null;
                    let currentKey = null;
                    let isMultiline = false;
                    let multilineContent = [];

                    for (const line of lines) {
                        const trimmedLine = line.trim();
                        
                        // Handle root level keys
                        if (line.match(/^\w+:$/) && !line.startsWith(' ')) {
                            currentKey = line.replace(':', '').trim();
                            result[currentKey] = [];
                            continue;
                        }

                        // Handle new items
                        if (line.trim().startsWith('-')) {
                            if (current) {
                                if (currentKey) {
                                    result[currentKey].push(current);
                                } else {
                                    result.push(current);
                                }
                            }
                            current = {};
                            isMultiline = false;
                            continue;
                        }

                        // Handle multiline content
                        if (line.includes('|')) {
                            isMultiline = true;
                            multilineContent = [];
                            continue;
                        }

                        if (isMultiline) {
                            if (line.startsWith('    ') || line.startsWith('\t')) {
                                multilineContent.push(line.substring(4));
                                if (current) {
                                    current.content = multilineContent.join('\n');
                                }
                                continue;
                            } else {
                                isMultiline = false;
                            }
                        }

                        // Handle regular key-value pairs
                        if (line.includes(':') && !isMultiline) {
                            const [key, ...values] = line.split(':');
                            const trimmedKey = key.trim();
                            const value = values.join(':').trim();
                            if (current && trimmedKey) {
                                current[trimmedKey] = value;
                            }
                        }
                    }

                    // Add the last item
                    if (current) {
                        if (currentKey) {
                            result[currentKey].push(current);
                        } else {
                            result.push(current);
                        }
                    }

                    return result;
                }
            };
        }
    </script>
</body>
</html>
