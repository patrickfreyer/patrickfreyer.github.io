---
layout: default
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Patrick Freyer's Personal Website">
    <title>Patrick Freyer | Personal Website</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Add Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="mainData()">
    <header class="header">
        <nav class="nav-container" x-data="{ isOpen: false }">
            <div class="nav-header">
                <div class="logo">PF</div>
                <button 
                    @click="isOpen = !isOpen" 
                    class="mobile-menu-button"
                    aria-label="Toggle menu">
                    <i class="fas" :class="isOpen ? 'fa-times' : 'fa-bars'"></i>
                </button>
            </div>
            <ul class="nav-links" :class="{ 'nav-open': isOpen }">
                <li><a href="#about" @click="isOpen = false">About</a></li>
                <li><a href="/flights/" @click="isOpen = false">Flights</a></li>
                <li><a href="#social" @click="isOpen = false">Connect</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% include hero.html %}

        {% assign profiles = site.data.social %}

        {% include about.html %}
        {% include social.html profiles=profiles %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; {{ 'now' | date: "%Y" }} Patrick Freyer. All rights reserved.</p>
        </div>
    </footer>

    <script>
        function mainData() {
            return {
                formatDate(dateStr) {
                    return new Date(dateStr).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                }
            };
        }
    </script>
</body>
</html>
