<section id="social" class="social-section">
    <div class="container">
        <h2>Stay in Touch</h2>
        <div class="social-grid">
            <template x-for="profile in socialProfiles" :key="profile.platform">
                <a :href="profile.url" class="social-card" target="_blank" rel="noopener noreferrer"
                   :style="{ '--accent-color': profile.color }">
                    <div class="social-icon">
                        <i :class="profile.icon"></i>
                    </div>
                    <div class="social-info">
                        <h3 class="social-platform" x-text="profile.platform"></h3>
                        <p class="social-username" x-text="'@' + profile.username"></p>
                        <p class="social-description" x-text="profile.description"></p>
                    </div>
                    <div class="social-arrow">
                        <i class="fas fa-arrow-right"></i>
                    </div>
                </a>
            </template>
        </div>
    </div>
</section>
