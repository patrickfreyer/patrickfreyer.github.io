---
layout: default
title: Flight Network
permalink: /flights/network/
---

<link rel="stylesheet" href="{{ '/assets/css/flight-views.css' | relative_url }}">

<div class="flight-view-page">
    <div class="view-switcher">
        <a href="{{ '/flights/' | relative_url }}">🌍 Globe</a>
        <a href="{{ '/flights/map/' | relative_url }}">🗺️ Map</a>
        <a href="{{ '/flights/network/' | relative_url }}" class="active">🕸️ Network</a>
        <a href="{{ '/flights/stats/' | relative_url }}">📊 Stats</a>
    </div>

    <div id="filter-panel" class="filter-panel">
        <div class="filter-header">
            <h3>Filters</h3>
            <button id="toggle-filters" class="toggle-filters-btn">‹</button>
        </div>
        <div class="filter-content">
            <div class="filter-group">
                <label for="year-filter">Year</label>
                <select id="year-filter" multiple size="6"></select>
            </div>
            <div class="filter-group">
                <label for="airline-filter">Airline</label>
                <select id="airline-filter" multiple size="6"></select>
            </div>
            <div class="filter-actions">
                <button id="apply-filters" class="filter-button">Apply</button>
                <button id="reset-filters" class="filter-button">Reset</button>
            </div>
            <div class="filter-group" style="color:#888;font-size:11px;line-height:1.5;margin-top:4px;">
                Node size = flights to a city · line thickness = times flown · drag to rearrange.
            </div>
        </div>
    </div>

    <div class="legend-panel">
        <h4>Airlines</h4>
        <div id="legend-content"></div>
    </div>

    <button id="reset-view" class="reset-view-btn">⟲ Reset layout</button>

    <div id="network-container" class="view-canvas"></div>
</div>

<script>
    const locationsData = {{ site.data.heroLocations | jsonify }};
    const flightRoutesData = {{ site.data.flightRoutes | jsonify }};
</script>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="{{ '/assets/js/flight-views-common.js' | relative_url }}"></script>
<script src="{{ '/assets/js/flight-network.js' | relative_url }}"></script>
