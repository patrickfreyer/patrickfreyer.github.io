<script type="module">
    // AR functionality
    let earthAR = null;
    let isARSupported = false;

    async function initAR() {
        try {
            // Check if WebXR is supported
            if (!navigator.xr) {
                console.warn('WebXR not supported');
                return false;
            }

            // Check if AR is supported
            const isARSupported = await navigator.xr.isSessionSupported('immersive-ar');
            if (!isARSupported) {
                console.warn('AR not supported on this device');
                return false;
            }

            return true;
        } catch (error) {
            console.error('AR check failed:', error);
            return false;
        }
    }

    async function setupARButton() {
        const arButton = document.getElementById('ar-button');
        if (!arButton) return;

        // Check AR support
        isARSupported = await initAR();
        
        if (!isARSupported) {
            arButton.disabled = true;
            arButton.textContent = '🌍 AR Not Available';
            arButton.title = 'AR is not supported on this device';
        } else {
            arButton.addEventListener('click', async () => {
                try {
                    arButton.disabled = true;
                    arButton.textContent = '🌍 Starting AR...';
                    
                    // Initialize AR
                    earthAR = new EarthAR();
                    await earthAR.init();
                    
                    // Create AR scene
                    earthAR.createARScene();
                    earthAR.createEarthForAR();
                    
                    // Show success message
                    arButton.textContent = '🌍 AR Active!';
                    arButton.style.background = 'linear-gradient(135deg, #51cf66 0%, #40c057 100%)';
                    
                    console.log('AR session started successfully');
                } catch (error) {
                    console.error('AR initialization failed:', error);
                    arButton.disabled = false;
                    arButton.textContent = '🌍 Experience in AR';
                    arButton.title = 'Failed to start AR. Please try again.';
                }
            });
        }
    }

    // Initialize AR button when page loads
    document.addEventListener('DOMContentLoaded', setupARButton);
</script>
