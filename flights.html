<div class="earth-visualization-page">
    <div id="filter-panel" class="filter-panel">
        <div class="filter-header">
            <h3>Filters</h3>
            <button id="toggle-filters" class="toggle-filters-btn">
                <i class="fas fa-chevron-left"></i>
            </button>
        </div>
        <div class="filter-content">
            <div class="filter-group">
                <label for="year-filter">Year</label>
                <select id="year-filter" multiple>
                    <!-- Will be populated by JavaScript -->
                </select>
            </div>
            <div class="filter-group">
                <label for="airline-filter">Airline</label>
                <select id="airline-filter" multiple>
                    <!-- Will be populated by JavaScript -->
                </select>
            </div>
            <div class="filter-group">
                <label for="occasion-filter">Occasion</label>
                <select id="occasion-filter" multiple>
                    <!-- Will be populated by JavaScript -->
                </select>
            </div>
            <div class="filter-group">
                <label for="travelers-filter">Travelers</label>
                <select id="travelers-filter" multiple>
                    <!-- Will be populated by JavaScript -->
                </select>
            </div>
            <div class="filter-actions">
                <button id="apply-filters" class="filter-button">Apply</button>
                <button id="reset-filters" class="filter-button">Reset</button>
            </div>
        </div>
    </div>
    <div id="earth-container" class="fullscreen"></div>
</div>

<script>
    const locationsData = {{ site.data.heroLocations | jsonify }};
    const flightRoutesData = {{ site.data.flightRoutes | jsonify }};
</script>

<script src="{{ '/assets/js/earth.js' | relative_url }}" type="module"></script>

<style>

        color: white;
        z-index: 1000;
        max-width: 300px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .filter-panel h3 {
        margin: 0 0 15px 0;
        font-size: 1.2em;
        color: #fff;
    }

    .filter-group {
        margin-bottom: 15px;

    .filter-group label {

    .filter-button {
