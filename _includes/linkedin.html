<section id="linkedin-feed" class="linkedin-section">
    <div class="container">
        <h2>GenAI in Action</h2>
        <div class="linkedin-grid">
            {% for post in include.embeds %}
            <div class="linkedin-card">
                <h3>{{ post.title }}</h3>
                <div class="linkedin-embed-container">
                    <iframe 
                        src="https://www.linkedin.com/embed/feed/update/urn:li:ugcPost:{{ post.embed_code }}"
                        height="400" 
                        width="200" 
                        frameborder="0" 
                        allowfullscreen=""
                        loading="lazy">
                    </iframe>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
